name: Build and publish Uozu Karnival site
# Fresh publishing run avoids duplicate artifact names from a previous rerun.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract official artwork
        run: |
          python -m pip install --disable-pip-version-check pymupdf
          python extract_official_artwork.py
      - name: Keep generated source artwork in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/map_area.png assets/map_station.png assets/shops/
          if ! git diff --cached --quiet; then
            git commit -m "Sync artwork extracted from official Uozu event PDF"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
